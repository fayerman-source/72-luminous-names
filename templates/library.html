{% extends "base.html" %}

{% block title %}Library - 72 Names Meditations{% endblock %}

{% block content %}
<h1 style="margin-bottom: 30px;">Meditation Library</h1>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px;">
    {% for name in names %}
    <a href="/session/{{ name.id }}" style="display: block; background: #14141a; padding: 20px; border-radius: 10px; text-decoration: none; border: 1px solid #2a2a35; transition: border-color 0.2s;">
        <div style="font-size: 2rem; color: #d4af37; margin-bottom: 8px;">{{ name.name }}</div>
        <div style="color: #fff; font-weight: 600;">{{ name.transliteration }}</div>
        <div style="color: #666; font-size: 0.85rem;">{{ name.theme }}</div>
    </a>
    {% endfor %}
</div>

<p style="margin-top: 30px; color: #555;">72 sessions available</p>
{% endblock %}
